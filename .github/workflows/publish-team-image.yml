# Publish the Team Cloud Sandbox image to a PUBLIC registry (Docker Hub) so any
# operator's Cloudflare account can reference it directly — no per-account
# `docker build`. The in-app "Create a team" auto-deploy points its Container at
# `docker.io/caspianzhao/helmor-team-sandbox:latest`.
#
# Built natively on amd64 (ubuntu-latest) — the image compiles the Rust release
# binary + GTK/WebKit stack, which segfaults under QEMU, so a local arm64 build
# can't produce it (CI is the supported path; see cloud-sandbox-image.yml).
#
# Required repo secret:
#   DOCKERHUB_TOKEN — a Docker Hub access token (Read & Write) for `caspianzhao`.
#
# Triggers: manual dispatch, or a push that touches the image inputs. After the
# first publish, flip the repo to Public in the Docker Hub UI if it isn't.
name: publish-team-image

on:
  workflow_dispatch:
  push:
    branches: [main, dohooo/team-cloud-sandbox]
    paths:
      - "Dockerfile"
      - ".github/workflows/publish-team-image.yml"

concurrency:
  group: publish-team-image
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The full image (Rust release + apt GTK/WebKit stack + vendored codex)
      # needs more scratch space than the runner's ~14 GB root disk. Reclaim the
      # large preinstalled toolchains we don't use (mirrors cloud-sandbox-image).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: caspianzhao
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build context is the repo root (the Dockerfile's stages `COPY . .`).
      # SANDBOX_VERSION / TARGET_TRIPLE default correctly in the Dockerfile for a
      # native amd64 build, so no build-args needed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # CF Containers reject `:latest`, so deploys reference the pinned tag;
          # `:latest` is kept only as a human-facing convenience pointer.
          tags: |
            docker.io/caspianzhao/helmor-team-sandbox:0.1.13
            docker.io/caspianzhao/helmor-team-sandbox:latest
          provenance: false
